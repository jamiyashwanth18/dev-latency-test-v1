# Alembic configuration. The database URL is not written here: env.py reads
# DATABASE_URL through app.config, so the same migrations run against the local
# SQLite file and against the deployed PostgreSQL with nothing to edit.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revision files are named 0001_..., 0002_... so the order they were written in is
# the order they read in on disk.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
